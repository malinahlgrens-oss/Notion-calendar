.calendar{
  width:100%;
  padding:0 0px 0px;
}

.header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  height:32px;
  margin-bottom:1px;
}

.header button:first-child{
  justify-self:center;
  margin-left:15%;
}

.header button:last-child{
  justify-self:center;
  margin-right:15%;
}
