<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Calendar</title>
<style>
  :root{
    --text:#000;
    --muted:#777;
    --outside:#c8c8c8;
    --today:#521919;
    --today-text:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  .calendar{
    width:100%;
    padding:0;
    margin:0;
  }
.header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  height:32px;
  margin-bottom:1px;
}

.header button:first-child{
  justify-self:end;
  margin-right:12px;
}

.header button:last-child{
  justify-self:start;
  margin-left:12px;
}
  .title{
    text-align:center;
    font-size:15px;
    line-height:20px;
    font-weight:500;
    letter-spacing:-.15px;
  }
  button{
    width:30px;height:30px;
    padding:0;border:0;
    background:transparent;
    color:var(--text);
    border-radius:6px;
    cursor:pointer;
    font-size:22px;
    font-weight:300;
    line-height:28px;
  }
  button:hover{background:rgba(0,0,0,.055)}
  .weekdays,.grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
  }
  .weekday{
    text-align:center;
    font-size:11px;
    line-height:16px;
    font-weight:500;
    color:var(--muted);
    padding:0 0 5px;
  }
  .day{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:30px;
    font-size:13px;
    line-height:1;
    font-weight:400;
    border-radius:6px;
  }
  .outside{
    color:var(--outside);
  }
  .today{
    background:var(--today);
    color:var(--today-text);
  }

  @media (max-width:420px){
    .header{height:34px;grid-template-columns:28px 1fr 28px}
    .title{font-size:14px}
    button{width:27px;height:27px;font-size:20px}
    .weekday{font-size:10px;padding-bottom:4px}
    .day{font-size:12px;border-radius:5px}
  }
  html, body{
    margin:0;
    adding:0;
  height:auto;
  min-height:0;
  overflow:hidden;
}
</style>
</head>
<body>
<div class="calendar" id="calendar">
  <div class="header">
    <button id="prev" aria-label="Föregående månad">‹</button>
    <div class="title" id="title"></div>
    <button id="next" aria-label="Nästa månad">›</button>
  </div>
  <div class="weekdays" id="weekdays"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const months=[
  "januari","februari","mars","april","maj","juni",
  "juli","augusti","september","oktober","november","december"
];
const weekdayNames=["M","T","O","T","F","L","S"];

const title=document.getElementById("title");
const grid=document.getElementById("grid");
const weekdays=document.getElementById("weekdays");

weekdayNames.forEach(name=>{
  const el=document.createElement("div");
  el.className="weekday";
  el.textContent=name;
  weekdays.appendChild(el);
});

const today=new Date();
let current=new Date(today.getFullYear(),today.getMonth(),1);

function makeDay(number, outside=false){
  const cell=document.createElement("div");
  cell.className="day" + (outside ? " outside" : "");
  cell.textContent=number;
  return cell;
}

function render(){
  const year=current.getFullYear();
  const month=current.getMonth();

  title.textContent=
    months[month][0].toUpperCase()+
    months[month].slice(1)+" "+year;

  grid.innerHTML="";

  const firstDay=new Date(year,month,1);
  const offset=(firstDay.getDay()+6)%7; // Monday first
  const numberOfDays=new Date(year,month+1,0).getDate();
  const previousMonthDays=new Date(year,month,0).getDate();

  // Föregående månads dagar
  for(let i=offset-1;i>=0;i--){
    grid.appendChild(
      makeDay(previousMonthDays-i,true)
    );
  }

  // Aktuell månads dagar
  for(let day=1;day<=numberOfDays;day++){
    const cell=makeDay(day);

    if(
      year===today.getFullYear() &&
      month===today.getMonth() &&
      day===today.getDate()
    ){
      cell.classList.add("today");
    }

    grid.appendChild(cell);
  }

  // Nästa månads dagar – endast tills veckan är komplett.
  const remainder=grid.children.length % 7;

  if(remainder !== 0){
    const daysToAdd=7-remainder;

    for(let day=1;day<=daysToAdd;day++){
      grid.appendChild(makeDay(day,true));
    }
  }
}

document.getElementById("prev").addEventListener("click",()=>{
  current=new Date(current.getFullYear(),current.getMonth()-1,1);
  render();
});
document.getElementById("next").addEventListener("click",()=>{
  current=new Date(current.getFullYear(),current.getMonth()+1,1);
  render();
});

render();
</script>
</body>
</html>
